[package]
name = "hugh"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, single-server Discord anti-raid and moderation bot"
license = "MIT"
repository = "https://github.com/Koyot-Digital/Hugh"
keywords = ["discord", "moderation", "security", "anti-raid"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serenity = { version = "0.12.5", default-features = false, features = ["cache", "client", "gateway", "http", "model", "rustls_backend"] }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
